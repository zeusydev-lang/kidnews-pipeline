# Tests and lint on every push and pull request.
#
# Database tests need the Neon test branch (.env.test), which CI doesn't have,
# so they are skipped here. Run them locally with `uv run pytest`.
# No secrets are used.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Tests (database tests are skipped without .env.test)
        run: uv run pytest -q -rs

  scheduler:
    name: Scheduler Worker typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scheduler/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

