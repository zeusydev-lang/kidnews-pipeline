[project]
name = "kidnews-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.4",
    "jinja2>=3.1.6",
    "litellm>=1.109.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "typing>=3.10.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
